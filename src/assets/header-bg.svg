<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Abstract topographic/map-inspired pattern -->
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#BE5C32;stop-opacity:0.08"/>
      <stop offset="50%" style="stop-color:#BE5C32;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#BE5C32;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Topographic contour lines -->
  <ellipse cx="300" cy="200" rx="280" ry="160" stroke="url(#line-grad)" stroke-width="1.5" fill="none"/>
  <ellipse cx="300" cy="200" rx="220" ry="120" stroke="url(#line-grad)" stroke-width="1.5" fill="none"/>
  <ellipse cx="300" cy="200" rx="160" ry="85" stroke="url(#line-grad)" stroke-width="1.5" fill="none"/>
  <ellipse cx="300" cy="200" rx="100" ry="55" stroke="url(#line-grad)" stroke-width="1.5" fill="none"/>

  <ellipse cx="900" cy="180" rx="320" ry="180" stroke="url(#line-grad)" stroke-width="1.5" fill="none"/>
  <ellipse cx="900" cy="180" rx="250" ry="140" stroke="url(#line-grad)" stroke-width="1.5" fill="none"/>
  <ellipse cx="900" cy="180" rx="180" ry="100" stroke="url(#line-grad)" stroke-width="1.5" fill="none"/>
  <ellipse cx="900" cy="180" rx="110" ry="60" stroke="url(#line-grad)" stroke-width="1.5" fill="none"/>

  <!-- Scattered pin markers -->
  <circle cx="150" cy="120" r="4" fill="#BE5C32" opacity="0.15"/>
  <circle cx="450" cy="280" r="3" fill="#BE5C32" opacity="0.12"/>
  <circle cx="750" cy="100" r="5" fill="#BE5C32" opacity="0.1"/>
  <circle cx="1050" cy="300" r="3.5" fill="#BE5C32" opacity="0.12"/>
  <circle cx="600" cy="350" r="4" fill="#D4944C" opacity="0.1"/>
  <circle cx="200" cy="320" r="3" fill="#D4944C" opacity="0.08"/>
  <circle cx="1000" cy="80" r="4.5" fill="#D4944C" opacity="0.1"/>
</svg>
