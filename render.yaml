services:
  # Backend API
  - type: web
    name: nicmap-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: nicmap-data
      mountPath: /data
      sizeGB: 1

  # Frontend static site
  - type: web
    name: nicmap
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://nicmap-1.onrender.com
